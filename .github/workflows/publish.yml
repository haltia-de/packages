# The Haltia apk repository (ADR 0004, phase B): every released package of
# the organization plus the meta packages, indexed, signed and served by
# GitHub Pages. Runs on a push, by hand and every 30 minutes, so a new
# release in any repository shows up without a cross-repository trigger.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: cache
          key: apk-cache-${{ github.run_id }}
          restore-keys: apk-cache-
      - name: Build the repository
        env:
          GH_TOKEN: ${{ github.token }}
          B8K_APK_PRIVKEY: ${{ secrets.B8K_APK_PRIVKEY }}
        run: docker run --rm -v "$PWD:/src" -e GH_TOKEN -e B8K_APK_PRIVKEY alpine:3.24 sh /src/build.sh
      - name: The apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          HALTIA_GPG_PRIVKEY: ${{ secrets.HALTIA_GPG_PRIVKEY }}
        run: docker run --rm -v "$PWD:/src" -e GH_TOKEN -e HALTIA_GPG_PRIVKEY debian:trixie sh /src/build-apt.sh
      - name: The Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
          HALTIA_GPG_PRIVKEY: ${{ secrets.HALTIA_GPG_PRIVKEY }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" site cache
          sh build-flatpak.sh
      # Pages takes an artifact of at most 1 GB; the noarch apks are a copy
      # in each architecture's folder, and links are uploaded as files.
      - name: The size of the site
        run: |
          size=$(du -sbLl site | cut -f1)
          echo "site: $((size / 1000000)) MB"
          [ "$size" -le 950000000 ] || { echo "::error::the site is over 950 MB"; exit 1; }
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
