# Who may publish what into the apt and Flatpak repositories: a repository
# of haltia-de, the Debian package names its releases may carry (comma
# separated), and the Flatpak app id of its bundle (- for none). Anything a
# release carries beyond this is left out, so one repository cannot sign
# in another's program or a distribution's package under the
# organization's key.
weather    haltia-weather      io.github.haltia_de.Weather
news       haltia-news         io.github.haltia_de.News
paint      haltia-paint        io.github.haltia_de.Paint
music      haltia-music        io.github.haltia_de.Music
messenger  haltia-messenger    io.github.haltia_de.Messenger
video      haltia-video        io.github.haltia_de.Video
kit        python3-haltia-kit  -
