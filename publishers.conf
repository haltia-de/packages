# Who may publish what into the apt, Flatpak and apk repositories: a
# repository of haltia-de, the Debian package names its releases may carry
# (comma separated), the Flatpak app id of its bundle and the apk package
# names (pkgname, comma separated) its releases may carry (- for none).
# Anything a release carries beyond this is left out, so one repository
# cannot sign in another's program or a distribution's package under the
# organization's key. A repository missing here may publish nothing; the
# meta packages of meta/ are built here and need no line.
weather    haltia-weather      io.github.haltia_de.Weather    b8k-weather,haltia-weather
news       haltia-news         io.github.haltia_de.News       b8k-news,haltia-news
paint      haltia-paint        io.github.haltia_de.Paint      b8k-paint,haltia-paint
music      haltia-music        io.github.haltia_de.Music      b8k-music,haltia-music
messenger  haltia-messenger    io.github.haltia_de.Messenger  b8k-max,haltia-messenger
video      haltia-video        io.github.haltia_de.Video      b8k-video,haltia-video
kit        python3-haltia-kit  -                              py3-b8k-compat,py3-b8k-compat-pyc,py3-haltia-kit,py3-haltia-kit-pyc
calendar   -                   -                              b8k-calendar,haltia-calendar
files      -                   -                              b8k-files,haltia-files
text       -                   -                              b8k-text,haltia-text
firefox    -                   -                              b8k-firefox,haltia-firefox
shell      -                   -                              b8k-shell,haltia-shell
